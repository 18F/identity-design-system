<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <link id="site-stylesheet" rel="stylesheet" href="{{ site.baseurl }}/assets/css/styles.css">
    <script>
      // Swap to the alternate stylesheet bucket before render when requested.
      if (new URLSearchParams(location.search).get('ui_test_bucket') === 'nds') {
        document.getElementById('site-stylesheet').href = '{{ site.baseurl }}/assets/css/nds/styles.css';
      }
    </script>
    <script src="{{ site.baseurl }}/assets/js/init.js"></script>
  </head>
  <body>
    {{ content }}
    <script src="{{ site.baseurl }}/assets/js/main.js"></script>
    <script>
      // Keep the active stylesheet bucket when navigating within the docs site.
      (function () {
        var bucket = new URLSearchParams(location.search).get('ui_test_bucket');
        if (!bucket) return;
        function apply() {
          var links = document.querySelectorAll('a[href]');
          for (var i = 0; i < links.length; i++) {
            var raw = links[i].getAttribute('href');
            if (!raw || raw.charAt(0) === '#') continue;
            var url;
            try {
              url = new URL(raw, location.href);
            } catch (e) {
              continue;
            }
            if (url.origin !== location.origin) continue;
            if (url.searchParams.get('ui_test_bucket') === bucket) continue;
            url.searchParams.set('ui_test_bucket', bucket);
            links[i].setAttribute('href', url.pathname + url.search + url.hash);
          }
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', apply);
        } else {
          apply();
        }
      })();
    </script>
  </body>
</html>
